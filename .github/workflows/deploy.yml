name: Build data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 9 AM Eastern, year-round. GitHub cron only speaks UTC, so this fires
    # at both 13:07 UTC (9:07 AM EDT) and 14:07 UTC (9:07 AM EST), and the
    # `gate` job below keeps only the one that matches New York's current
    # UTC offset -- one real run a day. Minute 7 rather than :00 because
    # GitHub's scheduler is busiest on the hour and can start those runs
    # hours late. Each run costs about one Odds API credit per game.
    - cron: "7 13 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          # Pushes and manual runs always go. A scheduled run goes if its
          # cron is the 9 AM ET one for New York's current offset (EDT ->
          # 13:07 UTC, EST -> 14:07 UTC). This keys off which cron fired,
          # not the clock, because GitHub can start scheduled runs hours
          # late -- a late 9 AM run should still run, just late.
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$(TZ=America/New_York date +%Z)" = "EDT" ]; then
            [ "$CRON" = "7 13 * * *" ] && run=true || run=false
          else
            [ "$CRON" = "7 14 * * *" ] && run=true || run=false
          fi
          echo "event=$EVENT cron='$CRON' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch NHL data & odds, run the model, grade past picks
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python generate_data.py

      # Everything else in data/ is rebuilt from scratch each run, but pick
      # history can't be recreated after the fact, and the box-score cache
      # behind the position rankings saves re-downloading the whole season,
      # so both are committed back to the repo (there's no database). Non-fatal: a rare push race
      # shouldn't block the deploy, and the next run recomputes anyway.
      - name: Commit pick history and position cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history data/cache
          if git diff --cached --quiet; then
            echo "No history/cache changes to commit."
          else
            git commit -m "Update pick history and position cache [skip ci]"
            git push || (git fetch origin main && git merge -X ours --no-edit origin/main && git push) || echo "::warning::Couldn't push pick history this run -- will retry next run."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (pulls in the freshly generated data)
        working-directory: frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
