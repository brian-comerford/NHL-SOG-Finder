<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <!-- iOS ignores SVG icons; this PNG is what "Add to Home Screen" uses.
         Full-bleed square -- iOS rounds the corners itself. iOS caches it
         by URL, so bump the filename (-v3, ...) whenever the art changes. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SOG Finder" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finds NHL shots-on-goal props that look mispriced by comparing a statistical projection to sportsbook odds."
    />
    <title>NHL SOG Finder</title>
    <script>
      // Applies any saved light/dark override before first paint, so
      // there's no flash of the wrong theme. Mirrors src/lib/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
